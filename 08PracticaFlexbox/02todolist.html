<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta http-equiv="X-UA-Compatible" content="IE=edge">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Tooltip</title>
     <link rel="stylesheet" href="fontawesome/css/all.css">
     <style>
          *{
               margin: 0;
               padding: 0;
               box-sizing: border-box;
               font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
          }

          body{
               height: 100vh;
               display: flex;
               justify-content: center;
               align-items: center;
               background: #111;
          }

          .container{
               background: #FFF;
               width: 350px;
          }

          h2{
               background: #03A9F4;
               color: #FFF;
               font-weight: 600;
               text-transform: uppercase;
               padding: 20px;
          }


          /* LISTA */
          .list{
               height: 500px;
               overflow-y: auto;
          }

          .list::-webkit-scrollbar{
               width: 5px;
          }

          .list::-webkit-scrollbar-thumb{
               background: #03A9F4;
               border-radius: 40px;
          }


          /* ITEMS */
          .item{
               padding: 20px;
               border-bottom: 1px solid rgba(0, 0, 0, 0.1);
               transition: all .5s;
          }

          .item:last-child{
               border-bottom: none;
          }

          .item:hover{
               background: rgba(0, 0, 0, 0.1);
          }

          .item label{
               display: flex;
               justify-content: space-between;
               align-items: center;
               cursor: pointer;
          }
          .item p{
            font-size: 18px;
            letter-spacing: 1px;
            font-weight: 400;
          }
          .item span{
            position:relative;
            width:30px;
            height:30px;
            border: 1px solid #8B8B8B;
            border-radius:50%;
            display:flex;
            justify-content:center;
            align-items:center;

          }
          /*Creacion del Check*/
          .item span::before{
            content:'';
            position:absolute;
            width:10px;
            height:5px;
            border-left:2px solid #8B8B8B8B;
            border-bottom: 2px solid #8B8B8B8B;
            transform: rotate(-40deg);

          }
          /* LISTA */
          .list{
               height: 500px;
               overflow-y: auto;
          }

          .list::-webkit-scrollbar{
               width: 5px;
          }

          .list::-webkit-scrollbar-thumb{
               background: #03A9F4;
               border-radius: 40px;
          }

          /*ESTADOS JAVASCRIPT*/
          /*Esconde el check 1primera opcion*/
          .item input{
            visibility: hidden;
            display: none; /*Aqui quita posicion*/

          }
         /*cUANDO YO CHECKE AL INPUT Y ESTE CHECK SE APLICARA ESTILOS AL PARRAFO QUE ESTA AL LADO */
          .item input:checked~ p{
            text-decoration:line-through;
            color: #ccc;
            font-weight: 600;
          }

          /*Cuando ya este chekeado ahora vas a trabajar con el hermano yacente span*/
           .item input:checked~ span{
                background: #03A9F4;
                border: 1px solid #03A9F4;
           }
        
    </style>
</head>
<body>
